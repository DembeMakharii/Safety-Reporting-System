<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Safety Reporting System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Authentication Page -->
    <div class="auth-container">
        <div class="auth-header">
            <h2><i class="fas fa-lock"></i> Safety System Access</h2>
            <p>Secure access to industrial safety reporting</p>
        </div>

        <div class="auth-form">
            <div id="alertContainer"></div>

            <div class="auth-tabs">
                <button class="auth-tab" onclick="window.location.href='login.html'"><i class="fas fa-sign-in-alt"></i> Login</button>
                <button class="auth-tab active"><i class="fas fa-user-plus"></i> Sign Up</button>
            </div>

            <!-- Signup Form -->
            <div>
                <form id="signupFormElement">
                    <div class="form-group">
                        <label for="signupName"><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="signupName" name="name" required 
                            placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="signupEmail"><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="signupEmail" name="email" required 
                            placeholder="your.email@company.com">
                    </div>

                    <div class="form-group">
                        <label for="signupPassword"><i class="fas fa-key"></i> Password</label>
                        <input type="password" id="signupPassword" name="password" required 
                            placeholder="Create a secure password" minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="signupConfirmPassword"><i class="fas fa-key"></i> Confirm Password</label>
                        <input type="password" id="signupConfirmPassword" name="confirmPassword" required 
                            placeholder="Confirm your password">
                    </div>



    
</body>
</html>
